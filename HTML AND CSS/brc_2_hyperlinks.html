 <!--

1. Document Structure

• <!DOCTYPE html>: Tells the web browser that this document is written in HTML5.
• <html lang="en">: The root element that wraps all the content. The lang="en" attribute specifies that the page content is in English.
• <head>: Contains metadata (information about the page) that does not show up on the website itself.
• <meta charset="UTF-8">: Sets the character encoding to UTF-8, allowing the page to display almost all written languages and symbols correctly.
• <meta name="viewport" content="width=device-width, initial-scale=1.0">: Ensures the webpage is responsive and scales properly on mobile screens and desktops.
• <title>hyperlinks</title>: Sets the name displayed on the browser tab.
• <body>: Contains all the visible content (links, text, images) that users see on the webpage.

2. The Hyperlinks (Anchor Tags)

• <a href="https://google.com" target="_blank" title="goesto google"> click me </a>
	• <a>: The anchor tag used to create a link.
	• href="https://google.com": Points the link to Google's website.
	• target="_blank": Instructs the browser to open this link in a new tab.
	• title="goesto google": Creates a tooltip pop-up that appears when a user hovers their mouse over the text.
	• click me: The actual clickable text visible on the page.
• <HR> or <hr>: Stands for Horizontal Rule. It draws a thin horizontal line across the page to visually separate content.
• <a href="BROCO_1_TASK.HTML"> song </a>
	• href="BROCO_1_TASK.HTML": Links to a local file named BROCO_1_TASK.HTML stored in the same folder as this project. Clicking "song" opens this file in the same tab.
• <a href="mailto:fake@test.com">mail</a>
	• href="mailto:fake@test.com": The mailto: prefix tells the browser to launch the user's default email program (like Outlook or Apple Mail) with the "To" field already filled out to fake@test.com.
-->
