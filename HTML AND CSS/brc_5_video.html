<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <video controls autoplay  muted loop  width="550"><!-- order of attributes in both audio and video matters it is based on priority from left to right or top down-->
        <source src="videos/Erwin Smiths Final Speech - My Soldiers_480p.mp4" type="video/mp4">
        <source src="videos/Erwin Smiths Final Speech - My Soldiers_480p.webm" type="video/webm">
    </video>
</body>
</html>

<!--
Attributes explained:
controls → Adds play/pause, volume, and other controls for the user.

autoplay → Starts playing automatically when the page loads.

muted → Ensures the video starts without sound (important because most browsers block autoplay unless muted).

loop → Restarts the video automatically after it ends.

width="550" → Sets the video width to 550 pixels.

<source> tags:
Provide multiple formats for browser compatibility:

MP4 (video/mp4) → Widely supported across browsers.

WebM (video/webm) → Open-source format, efficient for web use.

The browser will pick the first format it supports. If it can’t play MP4, it will try WebM.
-->
