<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUDIO</title>
</head>
<body>
    <pre>NEFFEX - Control (Official Music Video - Copyright Free)_MP3.mp3 </pre>
    <audio controls 
        autoplay 
        loop 
        muted
        title ="contoll take it" >
        <source src="audio/NEFFEX - Control (Official Music Video - Copyright Free)_MP3.mp3"
    </audio>
</body>
</html>


<!-- code breakdown-->
 <!--Elements explained:
<pre> → Displays text exactly as written (preserves spaces, line breaks, formatting). Here it shows the filename of the audio track.

<audio> → Embeds an audio player in the page.

Attributes:
controls → Adds play/pause, volume, and other controls for the user.

autoplay → Starts playing automatically when the page loads.

loop → Restarts the audio automatically after it ends.

muted → Ensures the audio starts without sound (important because most browsers block autoplay unless muted).

title="contoll take it" → Tooltip text shown when hovering over the audio element.

<source> tag:
Defines the audio file to play.

src="audio/NEFFEX - Control (Official Music Video - Copyright Free)_MP3.mp3" → Path to the audio file.

You can add multiple <source> tags with different formats (e.g., .ogg, .wav) for better browser compatibility.
 -->
